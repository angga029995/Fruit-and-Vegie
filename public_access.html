<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>FreshCatalog Pro — Katalog Publik</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font: 16px system-ui, sans-serif; background: #f1f3f5; }
    #catalog { display: block; width: 100%; height: 100%; border: 0; }
    #notice {
      position: fixed; z-index: 2; left: 50%; bottom: 1rem; transform: translateX(-50%);
      max-width: calc(100% - 2rem); padding: .75rem 1rem; border-radius: 12px;
      background: #212529; color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.2);
      line-height: 1.5; text-align: center;
    }
    #notice[hidden] { display: none; }
    #notice a { color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <iframe id="catalog" title="FreshCatalog Pro" src="./fresh_catalog_v4.html" allow="clipboard-read; clipboard-write"></iframe>
  <div id="notice" role="status" hidden>
    Katalog belum selesai dimuat. Muat ulang halaman atau <a href="./fresh_catalog_v4.html">buka katalog langsung</a>.
  </div>
  <script>
    // Halaman katalog dan pembungkus berada pada origin GitHub Pages yang sama.
    // Nonaktifkan intro dekoratif agar pengunjung langsung dapat memakai katalog.
    const frame = document.getElementById('catalog');
    const notice = document.getElementById('notice');
    let loadTimer;

    function enableCatalog() {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) throw new Error('Catalog document is not available');

        const intro = doc.getElementById('sysIntro');
        if (intro) {
          intro.style.display = 'none';
          intro.setAttribute('aria-hidden', 'true');
        }
        doc.body.classList.remove('si-lock');
        notice.hidden = true;
        window.clearTimeout(loadTimer);
      } catch (_) {
        notice.hidden = false;
      }
    }

    frame.addEventListener('load', () => {
      // Beri waktu singkat untuk inisialisasi script katalog.
      window.setTimeout(enableCatalog, 100);
    });
    loadTimer = window.setTimeout(() => { notice.hidden = false; }, 10000);
  </script>
</body>
</html>
