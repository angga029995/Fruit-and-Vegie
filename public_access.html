<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>FreshCatalog Pro — Katalog Publik</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font: 16px system-ui, sans-serif; background: #f1f3f5; }
    #catalog { display: block; width: 100%; height: 100%; border: 0; }
    #notice { position: fixed; z-index: 2; left: 50%; bottom: 1rem; transform: translateX(-50%); max-width: calc(100% - 2rem); padding: .7rem 1rem; border-radius: 999px; background: #212529; color: white; box-shadow: 0 2px 12px #0003; text-align: center; }
    #notice[hidden] { display: none; }
  </style>
</head>
<body>
  <iframe id="catalog" title="FreshCatalog Pro" src="./fresh_catalog_v4.html" allow="clipboard-read; clipboard-write"></iframe>
  <div id="notice" role="status" hidden>Katalog belum selesai dimuat. Muat ulang halaman atau buka <a href="./fresh_catalog_v4.html" style="color:#fff">katalog langsung</a>.</div>
  <script>
    // Halaman katalog dan pembungkus berada di origin GitHub Pages yang sama.
    // Hilangkan layar intro dekoratif yang dapat menghalangi interaksi pengunjung.
    const frame = document.getElementById('catalog');
    const notice = document.getElementById('notice');
    let loadTimer;

    function enableCatalog() {
      try {
        const doc = frame.contentDocument;
        if (!doc) throw new Error('Catalog document is not available');

        const intro = doc.getElementById('sysIntro');
        if (intro) {
          intro.classList.add('out');
          intro.setAttribute('aria-hidden', 'true');
        }
        if (doc.body) doc.body.classList.remove('si-lock');
        notice.hidden = true;
        window.clearTimeout(loadTimer);
      } catch (_) {
        notice.hidden = false;
      }
    }

    frame.addEventListener('load', () => {
      // Allow the catalog's own scripts to initialize before removing its intro.
      window.setTimeout(enableCatalog, 100);
    });
    loadTimer = window.setTimeout(() => { notice.hidden = false; }, 10000);
  </script>
</body>
</html>
