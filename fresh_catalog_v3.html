<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreshCatalog Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --fruit: #FF6B35; --fruit-soft: #FFF0EA; --fruit-mid: #FFD4C0;
  --veg:   #1B8A4C; --veg-soft:  #E8F8EE; --veg-mid:  #B8E8CC;
  --g50:#F8F9FA; --g100:#F1F3F5; --g200:#E9ECEF; --g300:#DEE2E6;
  --g400:#ADB5BD; --g500:#6C757D; --g700:#343A40; --g900:#212529;
  --act: #FF6B35; --act-soft: #FFF0EA; --act-mid: #FFD4C0;
  --r8:8px; --r14:14px; --r20:20px;
  --sh: 0 2px 12px rgba(0,0,0,.08);
  --shf: 0 8px 32px rgba(0,0,0,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--g100);color:var(--g900);min-height:100vh;padding-bottom:100px}

/* ═══ HEADER ═══ */
header{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--g200);box-shadow:0 1px 8px rgba(0,0,0,.06)}
.h-top{padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;flex:1}
.logo em{color:var(--act);font-style:italic}
.logo small{font-size:10px;font-weight:400;color:var(--g400);font-family:'JetBrains Mono',monospace}

.btn-export{display:flex;align-items:center;gap:5px;padding:8px 14px;background:var(--g900);color:#fff;border:none;border-radius:100px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-export:hover{background:var(--g700)}
.btn-export:active{transform:scale(.96)}

/* TABS */
.tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:100px;border:2px solid var(--g200);background:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--g400);cursor:pointer;transition:all .22s;white-space:nowrap;flex-shrink:0}
.tab .pill{padding:2px 8px;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;background:var(--g100);color:var(--g500);transition:all .22s}
.tab.fa{background:var(--fruit-soft);border-color:var(--fruit);color:var(--fruit)}
.tab.fa .pill{background:var(--fruit);color:#fff}
.tab.va{background:var(--veg-soft);border-color:var(--veg);color:var(--veg)}
.tab.va .pill{background:var(--veg);color:#fff}

/* SEARCH */
.s-row{padding:0 16px 10px;position:relative}
.s-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.4;pointer-events:none}
.s-clr{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:0;border:none;background:none;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center}
.s-clr.on{opacity:.5}
.s-clr:hover{opacity:1}
#searchInput{width:100%;padding:11px 40px;border-radius:100px;border:2px solid var(--g200);background:var(--g50);font-family:'Inter',sans-serif;font-size:14px;color:var(--g900);outline:none;transition:all .2s}
#searchInput:focus{border-color:var(--act);background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 12%,transparent)}
#searchInput::placeholder{color:var(--g400)}

/* SORT BAR */
.sort-bar{display:flex;align-items:center;gap:6px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.sort-bar::-webkit-scrollbar{display:none}
.sl{font-size:11px;color:var(--g400);flex-shrink:0}
.sb{padding:5px 12px;border-radius:100px;border:1.5px solid var(--g200);background:#fff;color:var(--g500);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:'Inter',sans-serif}
.sb.on{background:var(--act-soft);border-color:var(--act-mid);color:var(--act)}

/* ═══ STATS ═══ */
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px 4px}
.st{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--g500);font-family:'JetBrains Mono',monospace}
.st strong{color:var(--act);font-weight:600}
.st-sep{width:3px;height:3px;border-radius:50%;background:var(--g300)}
#fBadge{display:none;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;background:var(--act-soft);color:var(--act);font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace}
#fBadge.on{display:flex}

/* ═══ NEW BADGE ═══ */
.new-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:100px;background:#FFE566;color:#7A5900;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.03em;flex-shrink:0}

/* ═══ CARDS ═══ */
.card-list{padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.pcard{background:#fff;border-radius:var(--r14);border:1.5px solid var(--g200);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;transition:all .18s ease;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--act);opacity:0;transition:opacity .18s}
.pcard:hover{border-color:var(--act-mid);box-shadow:0 4px 20px rgba(0,0,0,.10);transform:translateY(-1px)}
.pcard:hover::before{opacity:1}
.pcard:active{transform:scale(.99)}
.pcard.new-item{border-color:var(--act-mid);background:var(--act-soft)}
.pcard.new-item::before{opacity:.6}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-desc{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--g900);line-height:1.35;word-break:break-word;white-space:normal;flex:1}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r8);font-family:'JetBrains Mono',monospace;font-size:11.5px;transition:all .15s}
.chip-bc{background:var(--g100);color:var(--g700);border:1px solid var(--g200);flex:1;min-width:0}
.chip-bc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-sku{background:var(--act-soft);color:var(--act);border:1px solid var(--act-mid);flex-shrink:0;font-weight:600}
.chip-ico{width:12px;height:12px;flex-shrink:0;opacity:.5}
.copy-hint{position:absolute;right:14px;top:12px;font-size:9px;color:var(--g300);opacity:0;transition:opacity .15s;pointer-events:none;font-family:'Inter',sans-serif}
.pcard:hover .copy-hint{opacity:1}

mark{background:#FFE566;border-radius:2px;padding:0 1px;color:inherit}

/* ═══ EMPTY ═══ */
.empty{text-align:center;padding:60px 20px}
.empty-ico{font-size:52px;margin-bottom:12px}
.empty h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;color:var(--g700)}
.empty p{font-size:13px;color:var(--g400)}

/* ═══ PAGINATION ═══ */
.pag{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;flex-wrap:wrap;gap:10px;background:#fff;border-top:1px solid var(--g200);margin-bottom:8px}
.pag-info{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--g400)}
.pag-ctrl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pb{min-width:34px;height:34px;padding:0 8px;border-radius:var(--r8);border:1.5px solid var(--g200);background:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--g700);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pb:hover:not(:disabled){border-color:var(--act);color:var(--act)}
.pb.on{background:var(--act);border-color:var(--act);color:#fff;font-weight:700}
.pb:disabled{opacity:.3;cursor:not-allowed}
.psz{padding:7px 10px;border-radius:var(--r8);border:1.5px solid var(--g200);font-family:'JetBrains Mono',monospace;font-size:12px;background:#fff;color:var(--g700);cursor:pointer;outline:none}

/* ═══ FAB (Floating Action Button) ═══ */
.fab{position:fixed;bottom:28px;right:20px;z-index:300;width:58px;height:58px;border-radius:50%;background:var(--act);color:#fff;border:none;cursor:pointer;box-shadow:0 6px 24px rgba(255,107,53,.45);display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.34,1.56,.64,1);font-size:26px;font-weight:300}
.fab:hover{transform:scale(1.1) rotate(45deg);box-shadow:0 10px 36px rgba(255,107,53,.55)}
.fab:active{transform:scale(.95) rotate(45deg)}
.fab svg{transition:transform .25s}
.fab:hover svg{transform:rotate(45deg)}

/* ═══ MODAL OVERLAY ═══ */
.overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.on{opacity:1;pointer-events:all}
.overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}

/* ═══ MODAL SHEET ═══ */
.sheet{position:relative;z-index:1;width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:0 0 40px;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.2,.64,1);max-height:92vh;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.overlay.on .sheet{transform:translateY(0)}

.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--g200);margin:12px auto 0}
.sheet-header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between}
.sheet-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.sheet-close{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--g200);background:var(--g100);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sheet-close:hover{background:var(--g200)}

/* TABS INSIDE MODAL */
.m-tabs{display:flex;gap:6px;padding:14px 20px 0}
.m-tab{flex:1;padding:8px;border-radius:10px;border:2px solid var(--g200);background:#fff;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--g400);cursor:pointer;transition:all .18s;text-align:center}
.m-tab.mfa{background:var(--fruit-soft);border-color:var(--fruit);color:var(--fruit)}
.m-tab.mva{background:var(--veg-soft);border-color:var(--veg);color:var(--veg)}

/* FORM FIELDS */
.form-body{padding:16px 20px 0}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--g500);letter-spacing:.06em;text-transform:uppercase;font-family:'Inter',sans-serif;margin-bottom:6px}
.field input, .field textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--g200);background:var(--g50);font-family:'Inter',sans-serif;font-size:14px;color:var(--g900);outline:none;transition:all .2s;resize:none}
.field input:focus, .field textarea:focus{border-color:var(--act);background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 10%,transparent)}
.field input::placeholder, .field textarea::placeholder{color:var(--g300)}
.field-hint{font-size:11px;color:var(--g400);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SCAN BUTTON */
.scan-row{display:flex;gap:8px;align-items:stretch}
.scan-row input{flex:1}
.btn-scan{padding:12px 14px;border-radius:12px;border:2px solid var(--g200);background:var(--g50);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;color:var(--g500);font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-scan:hover{border-color:var(--act);color:var(--act);background:var(--act-soft)}
.btn-scan:active{transform:scale(.97)}

/* VALIDATION */
.field.error input, .field.error textarea{border-color:#FF4D4F;background:#FFF2F2}
.field-err{font-size:11px;color:#FF4D4F;margin-top:4px;display:none}
.field.error .field-err{display:block}

/* DUPLICATE WARNING */
.dup-warn{display:none;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#FFF8E6;border:1.5px solid #FFD666;margin-top:6px}
.dup-warn.on{display:flex}
.dup-warn p{font-size:12px;color:#7A5900;font-weight:500}

/* PREVIEW CARD */
.preview-section{margin:12px 20px 0;padding:14px;border-radius:14px;background:var(--g50);border:1.5px dashed var(--g300)}
.preview-label{font-size:10px;font-weight:700;color:var(--g400);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;font-family:'Inter',sans-serif}
.preview-card{background:#fff;border-radius:10px;border:1.5px solid var(--g200);padding:12px}
.preview-desc{font-size:13px;font-weight:600;color:var(--g900);margin-bottom:8px;line-height:1.3}
.preview-meta{display:flex;gap:6px;flex-wrap:wrap}
.pv-chip{padding:4px 9px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px}
.pv-bc{background:var(--g100);color:var(--g700);border:1px solid var(--g200)}
.pv-sk{background:var(--act-soft);color:var(--act);border:1px solid var(--act-mid);font-weight:600}

/* SUBMIT BUTTON */
.btn-submit{width:100%;margin:16px 20px 0;width:calc(100% - 40px);padding:15px;border-radius:14px;border:none;background:var(--act);color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.02em}
.btn-submit:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,107,53,.35)}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* MANAGE SECTION */
.manage-section{margin:12px 20px 0}
.manage-title{font-size:11px;font-weight:700;color:var(--g500);letter-spacing:.06em;text-transform:uppercase;font-family:'Inter',sans-serif;margin-bottom:8px}
.manage-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--g50);border:1px solid var(--g200);margin-bottom:6px;transition:all .15s}
.manage-item:hover{border-color:var(--g300);background:#fff}
.mi-info{flex:1;min-width:0}
.mi-desc{font-size:12px;font-weight:600;color:var(--g900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-meta{font-size:10px;color:var(--g400);font-family:'JetBrains Mono',monospace;margin-top:1px}
.mi-cat{padding:2px 7px;border-radius:100px;font-size:9px;font-weight:700;flex-shrink:0}
.mi-cat.fruit{background:var(--fruit-soft);color:var(--fruit)}
.mi-cat.veg{background:var(--veg-soft);color:var(--veg)}
.btn-del{width:30px;height:30px;border-radius:8px;border:1.5px solid #FFE0E0;background:#FFF5F5;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.btn-del:hover{background:#FF4D4F;border-color:#FF4D4F}
.btn-del:hover svg{stroke:#fff}
.btn-del svg{stroke:#FF4D4F;transition:stroke .15s}

.empty-manage{text-align:center;padding:20px;color:var(--g400);font-size:12px}

/* TABS IN MODAL: add vs manage */
.action-tabs{display:flex;border-bottom:2px solid var(--g200);margin:12px 0 0}
.at{flex:1;padding:10px;font-size:13px;font-weight:600;color:var(--g400);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.at.on{color:var(--act);border-bottom-color:var(--act)}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--g900);color:#fff;padding:11px 20px;border-radius:100px;font-size:12px;font-weight:600;box-shadow:var(--shf);opacity:0;transition:all .25s ease;z-index:999;white-space:nowrap;display:flex;align-items:center;gap:6px}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* SUCCESS ANIMATION */
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) forwards}

/* ═══ RESPONSIVE ═══ */
@media(min-width:600px){
  .card-list,.h-top,.tabs,.s-row,.stats,.sort-bar{padding-left:24px;padding-right:24px}
  .s-ico{left:36px} .s-clr{right:36px}
  #searchInput{padding:12px 44px;font-size:15px}
  .pcard{padding:16px 20px}
  .card-desc{font-size:15px}
  .fab{bottom:36px;right:32px;width:64px;height:64px}
  .sheet{border-radius:20px;margin:20px;width:calc(100% - 40px);max-width:540px;align-self:center}
  .overlay{align-items:center}
  .pag{padding:14px 24px}
}

/* ═══ SPLASH SCREEN ═══ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#FF6B35 0%,#ff9a62 40%,#1B8A4C 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;transition:opacity .6s ease, visibility .6s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo{
  font-family:'Syne',sans-serif;font-size:36px;font-weight:800;
  color:#fff;letter-spacing:-1px;text-align:center;margin-bottom:6px;
  text-shadow:0 2px 20px rgba(0,0,0,.2);
}
.splash-logo em{font-style:italic;color:#FFE566;}
.splash-sub{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:rgba(255,255,255,.75);letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:48px;
}
.splash-note{
  font-family:'Inter',sans-serif;font-size:12px;
  color:rgba(255,255,255,.6);margin-bottom:18px;letter-spacing:.02em;
}
.splash-btn{
  display:flex;align-items:center;gap:10px;
  padding:18px 48px;border-radius:100px;border:none;
  background:#fff;color:#FF6B35;
  font-family:'Syne',sans-serif;font-size:18px;font-weight:800;
  cursor:pointer;letter-spacing:.02em;
  box-shadow:0 8px 40px rgba(0,0,0,.25);
  transition:transform .18s, box-shadow .18s;
  animation: pulse 1.8s infinite;
}
.splash-btn:active{transform:scale(.96);}
@keyframes pulse{
  0%,100%{box-shadow:0 8px 40px rgba(0,0,0,.25), 0 0 0 0 rgba(255,255,255,.4);}
  50%{box-shadow:0 8px 40px rgba(0,0,0,.25), 0 0 0 14px rgba(255,255,255,.0);}
}
.splash-waves{
  position:absolute;bottom:0;left:0;right:0;overflow:hidden;height:80px;
}
.splash-waves svg{display:block;}

/* music toggle btn */
#musicBtn{
  position:fixed;bottom:96px;right:20px;z-index:400;
  width:46px;height:46px;border-radius:50%;
  background:#FF6B35;color:#fff;border:2px solid #FF6B35;
  box-shadow:0 4px 16px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:20px;transition:all .2s;
}

</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header>
  <div class="h-top">
    <div class="logo">Fresh<em>Catalog</em> <small>PRO</small></div>
    <button class="btn-export" onclick="exportCSV()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
  </div>

  <div class="tabs">
    <button class="tab fa" id="tabF" onclick="switchTab('fruit')">🍊 Fruit <span class="pill" id="pillF">0</span></button>
    <button class="tab"   id="tabV" onclick="switchTab('vegetable')">🥦 Vegetable <span class="pill" id="pillV">0</span></button>
  </div>

  <div class="s-row">
    <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Cari nama produk, SKU, atau barcode…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="s-clr" id="clrBtn" onclick="clearSearch()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="sort-bar">
    <span class="sl">Sort:</span>
